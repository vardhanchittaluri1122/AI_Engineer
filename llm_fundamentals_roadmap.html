{id:"foundation",label:"Tier 1 — Foundation",color:"#185FA5",bg:"var(--bg-accent)",text:"var(--text-accent)",topics:[
  {icon:"ti-brain",title:"What is an LLM?",sub:"Large language model basics",
   detail:"An LLM is a deep learning model trained on massive text data to understand and generate human language. It learns statistical patterns — which word/token is likely to come next given context.",

  {icon:"ti-binary-tree",title:"Tokens & tokenisation",sub:"How text is converted to numbers",

   example:`"ChatGPT" → ["Chat","G","PT"] → [14126, 38, 2705]\n"Hello world" → 2 tokens\n"antidisestablishmentarianism" → ~6 tokens`,

  {icon:"ti-math-function",title:"Embeddings",sub:"Turning tokens into vectors",

   example:`embed("dog")  → [0.21, -0.43, 0.88, ...] (768 dims)\nembed("cat")  → [0.19, -0.41, 0.85, ...]\ncosine_sim("dog","cat") ≈ 0.93  # similar!`,

  {icon:"ti-number",title:"Probability & softmax",sub:"How models pick the next token",

  {icon:"ti-git-branch",title:"Autoregressive generation",sub:"One token at a time",

   example:`Chinchilla law:\nFor 70B model → train on ~1.4T tokens (optimal)\nLlama 2 70B   → trained on 2T tokens (over-trained)\nResult: smaller but over-trained models > larger under-trained`,

   example:`FP32: 4 bytes/param → 70B model = 280 GB\nFP16: 2 bytes/param → 70B model = 140 GB\nINT8: 1 byte/param  → 70B model = 70 GB\nINT4: 0.5 bytes     → 70B model = 35 GB (fits on Mac!)`,

{id:"applied",label:"Tier 4 — Applied LLM Engineering",color:"#4A148C",bg:"var(--bg-pro)",text:"var(--text-pro)",topics:[

   example:`Query: "What is Claude's context window in 2026?"\n1. Embed query → [0.21, -0.43, ...]\n2. Search vector DB → retrieve top 3 docs\n3. Prompt: "Use this context: [docs]\n   Answer: What is Claude's context window?"\n4. LLM answers from retrieved context`,

let openSet=new Set();
let currentFilter='all';

function countAll(){return TIERS.reduce((s,t)=>s+t.topics.length,0);}
const TOTAL=countAll();

function updateStats(){
  document.getElementById('opened-count').textContent=openSet.size;
  const p=Math.round(openSet.size/TOTAL*100);
  document.getElementById('pct').textContent=p+'%';
  document.getElementById('prog').style.width=p+'%';
}

function toggleCard(id){
  const body=document.getElementById('body-'+id);
  const card=document.getElementById('card-'+id);
  if(openSet.has(id)){
    openSet.delete(id);
    body.classList.remove('open');
    card.classList.remove('open');
  } else {
    openSet.add(id);
    body.classList.add('open');
    card.classList.add('open');
  }
  updateStats();
}

function filterTier(tier,btn){
  currentFilter=tier;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  TIERS.forEach(t=>{
    const section=document.getElementById('tier-'+t.id);
    if(section) section.style.display=(tier==='all'||tier===t.id)?'':'none';
  });
}

function renderRoadmap(){
  const container=document.getElementById('roadmap-container');
  container.innerHTML='';
  TIERS.forEach((tier,ti)=>{
    const section=document.createElement('div');
    section.className='tier-row';
    section.id='tier-'+tier.id;

    const label=document.createElement('div');
    label.className='tier-label';
    label.style.cssText=`background:${tier.bg};color:${tier.text};border:0.5px solid ${tier.color}22`;
    label.innerHTML=`<i class="ti ti-${ti===0?'seedling':ti===1?'cpu':ti===2?'brain':ti===3?'tool':'rocket'}" aria-hidden="true"></i>${tier.label}`;
    section.appendChild(label);

    const grid=document.createElement('div');
    grid.className='cards-grid';

    tier.topics.forEach((topic,i)=>{
      const uid=tier.id+'-'+i;
      const card=document.createElement('div');
      card.className='topic-card';
      card.id='card-'+uid;
      card.onclick=()=>toggleCard(uid);
      card.innerHTML=`
        <i class="ti ${topic.icon}" style="font-size:20px;color:${tier.color}" aria-hidden="true"></i>
        <div class="card-title">${topic.title}</div>
        <div class="card-sub">${topic.sub}</div>
        <div class="card-body" id="body-${uid}">
          <div class="card-detail">
            ${topic.detail}
            <div class="ex-label" style="margin-top:10px">Example</div>
            <div class="ex-block">${topic.example.replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>')}</div>
            <div class="tags">${topic.tags.map(t=>`<span class="tag" style="background:${tier.bg};color:${tier.text}">${t}</span>`).join('')}</div>
          </div>
        </div>`;
      grid.appendChild(card);
    });

    section.appendChild(grid);
    container.appendChild(section);
  });
}

renderRoadmap();
updateStats();
</script>
